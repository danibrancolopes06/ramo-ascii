<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Ramos de flores dibujados con letras de colores.">
  <title>Ramo ASCII</title>
  <!-- Vista previa al compartir el enlace (WhatsApp, Instagram, etc.) -->
  <meta property="og:title" content="¿Quién necesita flores si puedes programarlas?">
  <meta property="og:description" content="Dos ramos de flores dibujados con letras de colores. Elige uno.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://danibrancolopes06.github.io/ramo-ascii/">
  <meta property="og:image" content="https://danibrancolopes06.github.io/ramo-ascii/vista-previa.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="420">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <canvas id="lienzo" aria-label="Animación de un ramo de flores hecho con letras"></canvas>

  <h1 id="titulo" class="titulo visible">
    <em>¿Quién</em> necesita flores <br>si <em>puedes</em> programarlas?
  </h1>

  <!-- Pantalla de inicio: se elige qué ramo ver -->
  <section id="inicio" class="inicio" aria-label="Elige un ramo">
    <p class="inicio-sub">Elige un ramo</p>
    <div class="tarjetas">
      <button type="button" class="tarjeta" data-escena="lirios">
<pre aria-hidden="true"><span class="r"> \ * /</span>   <span class="a">\|/</span>
<span class="r">-- @ --</span>  <span class="a">-@-</span>
<span class="r"> / * \</span>   <span class="a">/|\</span>
<span class="v">   \  |  /</span>
<span class="v">    \ | /</span>
<span class="v">     \|/</span>
<span class="v">      |</span></pre>
        <span class="tarjeta-nombre">Lirios</span>
      </button>
      <button type="button" class="tarjeta" data-escena="jarron">
<pre aria-hidden="true"><span class="r">  (@)</span><span class="a">(@)</span><span class="p">(@)</span>
<span class="p"> (@)</span><span class="r">(@)</span><span class="az">(@)</span><span class="a">(@)</span>
<span class="v">   \ \|/ /</span>
<span class="az">    )===(</span>
<span class="az">   /#####\</span>
<span class="m">  |#######|</span>
<span class="m">   \#####/</span></pre>
        <span class="tarjeta-nombre">Jarrón</span>
      </button>
    </div>
  </section>

  <nav class="controles oculto" aria-label="Escenas">
    <button type="button" data-escena="lirios" aria-pressed="false">Lirios</button>
    <button type="button" data-escena="jarron" aria-pressed="false">Jarrón</button>
    <button type="button" id="repetir" aria-label="Repetir la animación">↻ Repetir</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
